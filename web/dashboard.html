<style>
/*WALLCSS*/
  :root{
    --bg:#eef2f0; --surface:#ffffff; --ink:#1b2a30; --muted:#61727a; --line:#d5dedb;
    --indigo:#4f63d8; --green:#1f9e6e; --gold:#d99a0b; --red:#d2463a; --track:#dfe6e3;
  }
  body.dark{
    --bg:#152024; --surface:#1d2b30; --ink:#e8efec; --muted:#95a7ae; --line:#2f4047;
    --indigo:#8193ff; --green:#3cc68f; --gold:#f2b93b; --red:#ff7a6e; --track:#2a3a40;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:22px;background:var(--bg)!important;color:var(--ink)!important;
    font-family:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
  h2{font-size:17px;margin:0 0 10px;font-weight:650}
  h3{font-size:15px;margin:18px 0 10px;font-weight:650}
  button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:6px 12px;border-radius:8px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--indigo)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:600}
  button.danger{color:var(--red)}
  input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  .bar{height:9px;background:var(--track);border-radius:9px;overflow:hidden;margin:6px 0}
  .fill{height:100%;background:var(--indigo);border-radius:9px;transition:width .5s}
  .fill.ok{background:var(--green)} .fill.gold{background:var(--gold)}

  .hero{display:flex;gap:22px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .ring{position:relative;width:124px;height:124px;flex:none}
  .ring > svg{transform:rotate(-90deg)}
  .ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .mas{font-size:50px;line-height:1;animation:float 3.5s ease-in-out infinite}
  .ring .lvl-lab{font-size:12px;color:var(--muted);margin-top:2px}
  @keyframes float{50%{transform:translateY(-5px)}}
  .hero-txt{flex:1;min-width:220px}
  .hero-txt .title{font-size:22px;font-weight:700}
  .chips{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
  .chip b{font-size:16px}
  .chip.coins b{color:var(--gold)}
  .chip.snd{display:inline-flex;align-items:center;gap:4px;padding:3px 10px}
  .chip.snd .x{font-size:16px;padding:0 2px}
  .chip.snd input{width:80px;accent-color:var(--indigo)}

  .tabs{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 14px;color:var(--muted);font-weight:600}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--indigo)}

  .today.met{border-color:var(--green)}
  .today p{margin:6px 0}
  .exam{border-top:1px solid var(--line);padding:14px 0 6px}
  .exam:first-of-type{border-top:none;padding-top:4px}
  .exam .name{font-size:15.5px;font-weight:650}
  .countdown{font-size:30px;font-weight:750;color:var(--indigo);text-align:right;line-height:1}
  .countdown small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
  .s-late .countdown{color:var(--red)} .s-done .countdown{color:var(--green)}
  .pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;margin-left:6px;border:1px solid currentColor}
  .pill.s-on{color:var(--indigo)} .pill.s-late{color:var(--red)} .pill.s-done{color:var(--green)} .pill.s-past,.pill.s-nodeck{color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0 6px}
  .grid b{font-size:18px}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}

  .form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:10px}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
  .decks{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0 10px}
  .decks label{display:block;padding:2px 0}
  .err{color:var(--red)}

  .chart{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:8px}
  .chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .chart .b{width:100%;background:var(--track);border-radius:5px 5px 2px 2px;min-height:3px}
  .chart .b.ok{background:var(--green)}
  .chart .lab{font-size:9.5px;color:var(--muted);margin-top:4px}

  /* salle de jeux */
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .game{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
  .game .ic{font-size:40px;line-height:1}
  .game .nm{font-weight:700;font-size:15px}
  .game .pr{color:var(--gold);font-weight:700}
  .game button{margin-top:auto}
  .kind{font-size:11.5px;color:var(--muted)}
  .frise{position:relative;height:120px;margin:10px 16px 6px}
  .fline{position:absolute;left:0;right:0;top:58px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--indigo),var(--gold))}
  .fmark{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;text-align:center;white-space:nowrap}
  .fmark.today{top:66px} .fmark.today::before{content:'';display:block;width:12px;height:12px;border-radius:50%;background:var(--indigo);margin:-14px auto 4px}
  .fmark.dl{top:48px;height:24px;border-left:2px dashed var(--muted);width:0}
  .fmark.dl span{position:absolute;top:26px;left:-18px;color:var(--muted);font-size:10.5px}
  .fmark.ex{top:calc(var(--row)*62px + 0px)}
  .fmark.ex b{display:block;font-size:12.5px;max-width:130px;overflow:hidden;text-overflow:ellipsis}
  .fmark.ex::after{content:'◆';display:block;color:#7a5cff;font-size:18px;line-height:1;margin-top:2px}
  .fmark.ex[style*="--row:1"]{top:76px}
  .fmark.ex[style*="--row:1"]::after{position:absolute;top:-24px;left:50%;transform:translateX(-50%)}
  .fmark.ex.late b{color:var(--red)}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .pcard{margin-bottom:0}
  .pst{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;margin:4px 0 8px}
  .pst.ahead,.pst.done{color:var(--green);background:rgba(31,158,110,.14)} .pst.ontime{color:#1c7ed6;background:rgba(28,126,214,.14)}
  .pst.late{color:var(--red);background:rgba(224,49,49,.14)} .pst.unknown,.pst.none{color:var(--muted);background:var(--track)}
  .pst.p-todo{color:var(--indigo);background:rgba(79,99,216,.13)} .pst.p-done,.pst.p-finished{color:var(--green);background:rgba(31,158,110,.14)}
  .pst.p-notset{color:var(--red);background:rgba(224,49,49,.14)} .pst.p-late{color:#e8590c;background:rgba(232,89,12,.14)}
  .planst{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:13px;margin:4px 0 2px}
  .planst.st-todo{color:var(--indigo)} .planst.st-done,.planst.st-finished{color:var(--green)} .planst.st-notset{color:var(--red)} .planst.st-late{color:#e8590c}
  .pnums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;text-align:center}
  .pnums b{display:block;font-size:17px} .pnums span{font-size:11px;color:var(--muted)}
  .late-tip{background:rgba(224,49,49,.08);border-radius:10px;padding:8px 10px}
  .heroTop{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .heroStage{position:relative;width:220px;text-align:center}
  .heroAv{font-size:170px;line-height:1;position:relative;z-index:1;animation:heroIdle 3s ease-in-out infinite}
  @keyframes heroIdle{50%{transform:translateY(-5px)}}
  .pedestal{width:170px;height:26px;margin:-18px auto 0;border-radius:50%;background:radial-gradient(ellipse,rgba(122,92,255,.35),transparent 70%)}
  .pow{display:inline-block;margin-top:6px;font-weight:800;color:var(--gold);background:rgba(217,154,11,.12);border-radius:999px;padding:3px 12px}
  .heroStats{flex:1;min-width:260px}
  .hs{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)} .hs b{font-size:16px} .hs small{color:var(--green)}
  .vsbox{display:flex;align-items:center;gap:12px;margin-top:12px;background:rgba(224,49,49,.07);border-radius:12px;padding:8px 12px}
  .vsart{font-size:48px;line-height:1}
  .forge{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .fslot{border:2px solid var(--tc);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
  .frow{display:flex;gap:10px;align-items:center} .fic{font-size:30px}
  .mat{font-weight:800}
  .tiers{display:flex;gap:4px} .tiers i{flex:1;height:6px;border-radius:4px;background:var(--track)} .tiers i.on{background:var(--tc)}
  .fnext{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:6px 8px}
  .fprev{font-size:56px;line-height:1}
  .fslot button{margin-top:auto}
  .fmax{font-weight:800;color:#9c36b5;text-align:center;padding:8px}
  .ugrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0}
  .ugrid3>div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
  .ugrid3 b{font-size:18px}
  .campus{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding:16px;border-radius:18px;
    background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.35),transparent 40%),linear-gradient(180deg,#bfe6a8,#8fcf7a);border:1px solid var(--line)}
  body.dark .campus{background:linear-gradient(180deg,#2f5a3a,#224530)}
  .campus{position:relative;overflow:hidden}
  .campus.ph-dusk{background:linear-gradient(180deg,#f7a4a0,#ffc98a 30%,#9fcf7a 55%,#7fbf6a)}
  .campus.ph-dawn{background:linear-gradient(180deg,#a9b6f0,#ffd1b0 30%,#a8dd90 55%,#8fcf7a)}
  .campus.night{background:linear-gradient(180deg,#0b1030,#1c2352 45%,#1f3a2c 70%,#173022)!important}
  .campus.snow{background:linear-gradient(180deg,#dbe8f3,#eef4f9 40%,#fbfdff)!important}
  .campus.night.snow{background:linear-gradient(180deg,#0b1030,#1c2352 45%,#6d7fa5 75%,#aab9d4)!important}
  .campus .moon{position:absolute;top:14px;right:26px;width:46px;height:46px;border-radius:50%;background:#fff8dc;box-shadow:0 0 30px 8px rgba(255,248,220,.45),inset -10px -4px 0 #efe3b8}
  .campus .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite}
  @keyframes tw{50%{opacity:.25}}
  .campus .flake{position:absolute;top:-20px;color:#fff;font-style:normal;font-size:14px;text-shadow:0 0 4px rgba(120,150,190,.6);
    animation:fall linear infinite;pointer-events:none;z-index:2}
  @keyframes fall{to{transform:translateY(900px) rotate(200deg)}}
  .campus .bld{position:relative;z-index:1}
  .campus.night .bld{background:rgba(24,30,64,.88);color:#e8ecff;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .campus.night .bld .muted{color:#a9b3d6}
  .campus.night .bart svg{filter:drop-shadow(0 0 10px rgba(255,214,90,.55)) brightness(.9)}
  .campus.snow .bld{box-shadow:0 -4px 0 #fff inset,0 4px 12px rgba(0,0,0,.08)}
  .campus.snow .bart::before{content:'';position:absolute;left:18%;right:18%;top:6px;height:10px;border-radius:10px;background:#fff;opacity:.9;z-index:1}
  .bld{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:5px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .bld.locked{opacity:.6} .bld button{margin-top:auto}
  .bart{position:relative;font-size:84px;line-height:1;text-align:center;height:92px}
  .bart .flag{position:absolute;top:0;right:14px;font-size:20px} .bart .gold{position:absolute;top:0;left:14px;font-size:20px}
  .bld .bn{font-weight:700}
  .bart .sil{filter:grayscale(1) brightness(.5);opacity:.3}
  .lv{display:flex;gap:4px} .lv i{width:16px;height:6px;border-radius:4px;background:var(--track)} .lv i.on{background:var(--gold)}
  .specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .spec{border-radius:14px;padding:12px 8px;text-align:center;background:var(--surface);border:2px solid var(--rc);position:relative;overflow:hidden}
  .spec .se{font-size:44px;line-height:1.1} .spec .sn{font-weight:700;font-size:12.5px;margin-top:4px} .spec .sr{font-size:11px;color:var(--rc);font-weight:700}
  .spec.lock{border-style:dashed;opacity:.55} .spec.lock .se{filter:grayscale(1)}
  .spec.r-legendaire:not(.lock)::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
    background-size:250% 100%;animation:shine 2.6s linear infinite}
  @keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
  .packwrap{height:260px;display:flex;align-items:center;justify-content:center;perspective:900px}
  .pcardx{width:170px;height:230px;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
  .pcardx.flip{transform:rotateY(180deg)}
  .pcardx>div{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .pfront{background:linear-gradient(135deg,#4f63d8,#7a5cff);color:#fff;font-size:64px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
  .pfront.shake{animation:chShake 1.2s}
  .pback{transform:rotateY(180deg);background:var(--surface);border:4px solid var(--rc);box-shadow:0 0 30px var(--rc)}
  .pback .se{font-size:80px;line-height:1} .pback .sn{font-weight:800;padding:0 8px} .pback .sr{color:var(--rc);font-weight:800}
  .event{background:linear-gradient(120deg,#2a1640,#5a2a4a 55%,#e8590c);color:#fff3e6;border:none}
  .event b{color:#ffd43b}
  .boss{background:linear-gradient(120deg,rgba(224,49,49,.07),transparent 60%),var(--surface)}
  .bossart{font-size:92px;line-height:1;flex:none;animation:bossIdle 2.6s ease-in-out infinite}
  .bossart.heroVs{font-size:80px;animation-delay:-1.3s} .vs{font:900 20px system-ui;color:var(--red);flex:none}
  @keyframes bossIdle{50%{transform:translateY(-4px) scale(1.02)}}
  .bhp{position:relative;height:18px;border-radius:10px;background:var(--track);overflow:hidden;margin:6px 0}
  .bhp div{height:100%;background:linear-gradient(90deg,#e03131,#ff6b6b);border-radius:10px}
  .bhp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--ink)}
  .quest{padding:8px 0;border-bottom:1px dashed var(--line)} .quest:last-child{border-bottom:none}
  .quest .rew{font-weight:700;color:var(--gold);white-space:nowrap}
  .quest.done span:first-child{text-decoration:line-through;opacity:.7}
  .chestrow{display:flex;align-items:center;gap:16px}
  .chestrow .cic{font-size:58px;line-height:1}
  .dots{display:flex;gap:6px;margin:6px 0}
  .dots i{width:22px;height:22px;border-radius:50%;background:var(--track);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}
  .dots i.on{background:var(--gold)}
  .calwrap{overflow-x:auto;padding-bottom:4px}
  .calm{display:grid;grid-auto-flow:column;grid-auto-columns:14px;font-size:10.5px;color:var(--muted);height:15px;margin-left:24px}
  .calbody{display:flex;gap:4px}
  .calday{display:grid;grid-template-rows:repeat(7,11px);gap:3px;font-size:9.5px;color:var(--muted);line-height:11px;width:20px}
  .cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:3px}
  .cal i{width:11px;height:11px;border-radius:3px;background:var(--track)}
  .cal i.e{background:none}
  .cal i.l1{background:rgba(31,158,110,.3)} .cal i.l2{background:rgba(31,158,110,.55)}
  .cal i.l3{background:rgba(31,158,110,.8)} .cal i.l4{background:#16774f}
  body.dark .cal i.l1{background:rgba(60,198,143,.28)} body.dark .cal i.l2{background:rgba(60,198,143,.5)}
  body.dark .cal i.l3{background:rgba(60,198,143,.75)} body.dark .cal i.l4{background:#3cc68f}
  .cal i.g{box-shadow:inset 0 0 0 1.6px var(--gold)}
  .calleg{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
  .calleg i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .calstats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
  .calstats b{font-size:18px;display:block}
  #caltip{position:fixed;z-index:80;background:rgba(22,24,32,.95);color:#fff;font-size:12px;padding:5px 9px;border-radius:8px;pointer-events:none;display:none}
  .chestwrap{position:relative;height:210px;display:flex;justify-content:center;align-items:flex-end}
  .chestwrap .rays{position:absolute;left:50%;top:48%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;opacity:0;
    background:repeating-conic-gradient(from 0deg,rgba(255,214,90,.45) 0deg 9deg,transparent 9deg 22deg);
    -webkit-mask:radial-gradient(circle,#000 15%,transparent 65%);mask:radial-gradient(circle,#000 15%,transparent 65%)}
  .chestwrap.open .rays{animation:chRays .8s ease-out forwards,chSpin 12s linear infinite}
  .chest{font-size:150px;line-height:1;position:relative}
  .chest.shake{animation:chShake 1.4s ease-in}
  @keyframes chShake{0%,100%{transform:none}15%{transform:rotate(-4deg)}30%{transform:rotate(4deg)}45%{transform:rotate(-7deg) scale(1.03)}
    60%{transform:rotate(7deg) scale(1.05)}75%{transform:rotate(-10deg) scale(1.08)}90%{transform:rotate(10deg) scale(1.1)}}
  @keyframes chRays{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
  @keyframes chSpin{to{rotate:360deg}}
  .loot{display:flex;flex-direction:column;gap:8px;align-items:center;min-height:40px;margin:10px 0}
  .loot div{font-size:17px;font-weight:700;animation:lootPop .5s cubic-bezier(.2,1.6,.4,1) both}
  .loot div.big{font-size:24px;color:var(--gold)}
  @keyframes lootPop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
  .ltd{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:#e8590c;border-radius:6px;padding:1px 6px;margin-left:4px}
  .casino .pos{color:var(--green);font-weight:600} .casino .neg{color:var(--red);font-weight:600}
  .lockbox{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px 16px;margin-top:8px;line-height:1.6}
  .stake{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .stake input{width:90px}
  .chips2{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
  .chips2 button{padding:4px 9px;font-size:12.5px}
  .chips2 button.sel{background:var(--indigo);color:#fff;border-color:var(--indigo)}
  .reels{display:flex;gap:10px;justify-content:center;margin:14px 0}
  .reel{width:92px;height:104px;border-radius:14px;background:linear-gradient(180deg,#fff,#eef1f6 45%,#fff);border:3px solid var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:54px;box-shadow:inset 0 6px 12px rgba(0,0,0,.12)}
  .reel.spin{filter:blur(1.2px)}
  .reel.stop{animation:reelStop .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes reelStop{0%{transform:translateY(-14px)}100%{transform:none}}
  .cashout{font-size:18px;padding:10px 26px}
  .mgrid{display:grid;grid-template-columns:repeat(5,58px);gap:7px;justify-content:center;margin:12px auto}

  .vbadge{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.88);color:#1d1d1f;border-radius:12px;padding:6px 10px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.12)}

<div id="app" class="muted">Chargement…</div>
<div id="overlay" hidden><div class="modal"><button class="close" title="Fermer" onclick="closeGame()">✕</button><div id="gameRoot"></div></div></div>

<script>
/*SFX*/
/*CONFETTI*/
const COIN='/*COINSVG*/';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function send(o){if(o.a!=='claim'&&o.a!=='refresh'&&o.a!=='score'&&o.a!=='minesPick')sfx('click');pycmd(JSON.stringify(o));}
function clamp(p){return Math.max(0,Math.min(1,p||0));}
function bar(p,cls){return `<div class="bar"><div class="fill ${cls||''}" style="width:${Math.round(clamp(p)*100)}%"></div></div>`;}
function fmt(iso){const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`;}
function cssv(n){return getComputedStyle(document.body).getPropertyValue(n).trim();}
function confirmDel(btn,fn){
  if(btn.dataset.c){fn();return;}
  btn.dataset.c='1'; const old=btn.textContent; btn.textContent='Confirmer ?';
  setTimeout(()=>{btn.dataset.c='';btn.textContent=old;},3000);
}
const STATUS={on:'En cours',late:'En retard',done:'Nouvelles cartes terminées',past:'Passé',nodeck:'Paquet introuvable'};
let V=null, TAB='jour';

function ring(p){
  const r=55,C=2*Math.PI*r,off=C*(1-clamp(p));
  return `<svg width="124" height="124" viewBox="0 0 124 124" aria-hidden="true">
    <circle cx="62" cy="62" r="${r}" fill="none" stroke="var(--track)" stroke-width="9"/>
    <circle cx="62" cy="62" r="${r}" fill="none" stroke="var(--gold)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>`;
}

/* ───────── onglet Aujourd'hui ───────── */
function thHtml(e){
  if(!(e.status==='on'||e.status==='late'))return '';
  if(e.extra){
    const tot=e.target+e.extra,done=e.intro_today>=tot;
    return `<div class="th on ${done?'ok':''}"><div class="row"><b>🔥 Mode tryhard ${done?'réussi ✅':'activé'}</b><span class="small"><b>${e.intro_today} / ${tot}</b> nouvelles (${e.target} + ${e.extra} bonus)</span></div>
      ${bar(e.intro_today/tot,done?'ok':'fire')}
      <div class="small muted">${e.next_with_extra!=null?`Demain : <b>${e.next_with_extra}/jour</b> au lieu de ${e.next_target} si tu les fais toutes.`:''} Bonus à la fin : +${2*e.extra} XP, +${3*e.extra} 🪙.</div>
      ${done?'':`<div class="actions"><button onclick="send({a:'tryhard',id:${e.id},extra:0})">Annuler le tryhard</button></div>`}</div>`;
  }
  if(!e.tryhard_options.length)return '';
  const miss=e.missed7?`Tu as sauté <b>${e.missed7} jour${e.missed7>1?'s':''}</b> cette semaine, ton objectif est monté. `:'';
  return `<div class="th"><div class="row"><b>🔥 Rattraper du retard</b>${e.next_target!=null?`<span class="small muted">Demain sans tryhard : ${e.next_target}/jour</span>`:''}</div>
    <div class="small muted">${miss}Fais plus de nouvelles cartes aujourd'hui pour alléger tous les jours suivants.</div>
    <div class="thopts">${e.tryhard_options.map(o=>`<button onclick="send({a:'tryhard',id:${e.id},extra:${o.extra}})"><b>+${o.extra}</b><span>${esc(o.label)}</span>${o.next!=null?`<small>puis ${o.next}/jour</small>`:''}</button>`).join('')}
      <span class="thc"><input type="number" min="1" max="${e.tryhard_room}" placeholder="autre" id="thc${e.id}"><button onclick="const x=+document.getElementById('thc${e.id}').value;if(x>0)send({a:'tryhard',id:${e.id},extra:x})">OK</button></span></div></div>`;
}
function examHtml(e){
  const cls='s-'+e.status;
  let h=`<div class="exam ${cls}"><div class="row">
    <div><span class="name">${esc(e.name)}</span><span class="pill ${cls}">${STATUS[e.status]||''}</span>
      <div class="muted small">Examen le ${fmt(e.date)}, nouvelles cartes à finir avant le ${fmt(e.deadline)} (marge de ${e.buffer} j)</div>
      <div class="muted small">Paquets : ${e.decks.map(esc).join(', ')||'aucun'}</div></div>
    ${e.status==='past'?'':`<div class="countdown">J-${e.days_to_exam}<small>avant l'examen</small></div>`}
  </div>`;
  if(e.status==='on'||e.status==='late'||e.status==='done'){
    const nOk=e.intro_today>=e.target;
    h+=`<div class="grid">
      <div><div class="muted small">Nouvelles cartes aujourd'hui</div><b>${e.intro_today} / ${e.target}</b>${nOk?' ✅':''}${bar(e.target?e.intro_today/e.target:1,nOk?'ok':'')}</div>
      <div><div class="muted small">Révisions dues</div><b>${e.due}</b>${e.due===0?' ✅':''}</div>
      <div><div class="muted small">Nouvelles cartes restantes</div><b>${e.new_remaining}</b></div>
      <div><div class="muted small">Paquet déjà vu</div><b>${e.seen_pct} %</b>${bar(e.seen_pct/100,'gold')}</div>
    </div>
    <p class="small">${esc(e.advice)}</p>
    ${thHtml(e)}
    ${e.plan?`<div class="planst st-${e.plan.state}">${esc(e.plan.label)}${e.plan.fixable?` <button class="primary" onclick="send({a:'fixExam',id:${e.id}})">Corriger en 1 clic</button>`:''}</div>`:''}
    <div class="actions">
      <button class="primary" onclick="send({a:'study',id:${e.id}})">Étudier</button>
      <button class="danger" onclick="confirmDel(this,()=>send({a:'delExam',id:${e.id}}))">Supprimer</button>
    </div>`;
  } else {
    h+=`<p class="small muted">${esc(e.advice)}</p><div class="actions">
      <button class="danger" onclick="confirmDel(this,()=>send({a:'delExam',id:${e.id}}))">Supprimer</button></div>`;
  }
  return h+'</div>';
}

function eventBanner(v){
  const e=v.event;
  if(e.state==='on')return `<div class="panel event">🎃 <b>Halloween</b> jusqu'au 2 novembre (encore ${e.days} j) · Chasse aux citrouilles :
    <b>${e.pumpkins}</b> trouvée${e.pumpkins>1?'s':''} (1 chance sur 20 à chaque carte, +25 🪙) · Objets en édition limitée dans la Boutique 🦇</div>`;
  if(e.state==='soon')return `<div class="panel event">🎃 Quelque chose se prépare… L'événement d'<b>Halloween</b> commence dans <b>${e.days} jour${e.days>1?'s':''}</b> 🦇</div>`;
  return '';
}
function bossHtml(v){
  const b=v.boss,pct=Math.max(0,Math.min(1,b.hp/b.max)),sh=Math.max(0,Math.min(1,(b.shield||0)/b.max));
  return `<div class="panel boss ${b.rage?'rage':''}"><div class="row" style="flex-wrap:nowrap;align-items:center;gap:18px">
    <div class="bossart heroVs">${v.hero.avatar}</div><div class="vs">VS</div><div class="bossart">${b.art}</div>
    <div style="flex:1;min-width:0"><div class="row"><h2>⚔️ ${esc(b.name)} <span class="muted small">niv. ${b.level}</span>${b.rage?' <span class="ragechip">😡 Enragé</span>':''}</h2>
      <span class="muted small">Boss vaincus : <b>${b.down}</b></span></div>

function calHtml(cells){
  const first=new Date(cells[0][0]+'T12:00:00'),pad=(first.getDay()+6)%7;
  const max=Math.max(1,...cells.map(c=>c[1]));
  const lvl=n=>n===0?0:n<=max*.25?1:n<=max*.5?2:n<=max*.75?3:4;
  let grid='';for(let i=0;i<pad;i++)grid+='<i class="e"></i>';
  const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  let months='',lastM=-1,cols=Math.ceil((pad+cells.length)/7);const mcol={};
  cells.forEach(([d,n,g],i)=>{grid+=`<i class="l${lvl(n)}${g?' g':''}" data-d="${d}" data-n="${n}" data-g="${g}"></i>`;
    const m=+d.slice(5,7)-1,col=Math.floor((pad+i)/7);if(m!==lastM){const prev=Object.keys(mcol).map(Number);
    if(!(col in mcol)&&!prev.some(p=>col-p<3))mcol[col]=MOIS[m];lastM=m;}});
  for(let c=0;c<cols;c++)months+=`<span>${mcol[c]||''}</span>`;
  const studied=cells.filter(c=>c[1]>0).length,total=cells.reduce((a,c)=>a+c[1],0);
  let best=0,cur=0;cells.forEach(c=>{cur=c[1]>0?cur+1:0;best=Math.max(best,cur);});
  let now=0;for(let i=cells.length-1;i>=0;i--){if(cells[i][1]>0)now++;else if(i<cells.length-1)break;}
  return `<div class="panel"><h2>📅 Mon année de révision</h2><div class="calwrap">
    <div class="calm">${months}</div>
    <div class="calbody"><div class="calday"><span></span><span>lun</span><span></span><span>mer</span><span></span><span>ven</span><span></span></div>
    <div class="cal" onmouseover="calTip(event)" onmouseout="calTip(null)">${grid}</div></div></div>
    <div class="calleg">Moins <i style="background:var(--track)"></i><i class="l1" style="background:rgba(31,158,110,.3)"></i><i style="background:rgba(31,158,110,.55)"></i><i style="background:rgba(31,158,110,.8)"></i><i style="background:#16774f"></i> Plus · <i style="box-shadow:inset 0 0 0 1.6px var(--gold)"></i> objectif atteint</div>
    <div class="calstats"><div><b>${total.toLocaleString('fr-FR')}</b><span class="muted small">révisions sur un an</span></div>
      <div><b>${studied}</b><span class="muted small">jours de révision</span></div>
      <div><b>${now}</b><span class="muted small">jours d'affilée en ce moment</span></div>
      <div><b>${best}</b><span class="muted small">plus longue série</span></div></div></div>`;
}
function calTip(e){
  let t=document.getElementById('caltip');if(!t){t=document.createElement('div');t.id='caltip';document.body.appendChild(t);}
  const c=e&&e.target&&e.target.dataset&&e.target.dataset.d;if(!c){t.style.display='none';return;}
  const [y,m,d]=c.split('-');const n=+e.target.dataset.n;
  t.textContent=`${d}/${m}/${y} : ${n} révision${n>1?'s':''}${e.target.dataset.g==='1'?' · objectif atteint ✅':''}`;
  const r=e.target.getBoundingClientRect();t.style.display='block';t.style.left=Math.min(innerWidth-220,r.left-40)+'px';t.style.top=(r.top-32)+'px';
}

  else if(pay>0){czBanner('push',`${pay} 🪙 récupérées`,`×${czM(mult)}${note?' · '+note:''}`);sfx('soft');}
  else{czBanner('lose','Perdu',`−${p.stake} 🪙${note?' · '+note:''}`);sfx('lose');}

/* ── 🎰 machine à sous ── */
function czSlots(){
  const SY=['🍒','🍋','🔔','⭐','💎','7️⃣'],HS=78,rnd=()=>SY[Math.random()*SY.length|0];
  document.getElementById('czStage').innerHTML=`<div class="sl-wrap"><div class="sl-cab" id="slCab">
      <div class="sl-head"><i class="cz-bulbs"></i>JACKPOT<b>7️⃣7️⃣7️⃣ ×50</b></div>
      <div class="sl-win">${[0,1,2].map(i=>`<div class="sl-reel"><div class="sl-strip" id="slS${i}"></div></div>`).join('')}<div class="sl-line"></div></div>
      <div class="sl-pay">7️⃣7️⃣7️⃣ ×50 · 💎💎💎 ×20 · ⭐⭐⭐ ×10 · 🔔🔔🔔 ×5<br>🍒🍒🍒 ou 🍋🍋🍋 ×3 · une paire ×2,5</div></div>
    <div class="sl-lever" id="slLev" title="Tire le levier vers le bas !"><div class="sl-rod" id="slRod"></div><div class="sl-hub"></div><div class="sl-knob" id="slKnob"></div></div></div>`;
  const cab=document.getElementById('slCab'),strips=[0,1,2].map(i=>document.getElementById('slS'+i));
  const cur=[0,1,2].map(()=>[rnd(),rnd(),rnd()]);
  const fill=(i,l)=>{strips[i].innerHTML=l.map(s=>`<div class="sl-sym">${s}</div>`).join('');};
  cur.forEach((l,i)=>fill(i,l));
  let round=null,tms=[],iv=0,alive=true;
  /* levier : on peut l'attraper et le tirer */
  const lev=document.getElementById('slLev'),knob=document.getElementById('slKnob'),rod=document.getElementById('slRod'),PIV=126,TOP=26,BOT=226;
  let ky=TOP,drag=null,sp=0;
  const setK=y=>{ky=Math.max(TOP,Math.min(BOT,y));knob.style.top=(ky-17)+'px';rod.style.top=Math.min(ky,PIV)+'px';rod.style.height=Math.abs(PIV-ky)+'px';};
  const tween=(to,ms,ease,done)=>{cancelAnimationFrame(sp);const from=ky,t0=performance.now();
    (function f(t){const k=Math.min(1,(t-t0)/ms);setK(from+(to-from)*ease(k));if(k<1)sp=requestAnimationFrame(f);else if(done)done();})(t0);};
  const back=()=>tween(TOP,620,k=>k<=0?0:k>=1?1:Math.pow(2,-10*k)*Math.sin((k*10-.75)*2.0944)+1);
  const pull=()=>tween(BOT,170,k=>k*k,()=>{sfx('hit');back();});
  setK(TOP);
  lev.onpointerdown=e=>{if(round||CT.busy)return;cancelAnimationFrame(sp);drag={y0:e.clientY,k0:ky,moved:false};lev.setPointerCapture(e.pointerId);lev.classList.add('drag');};
  lev.onpointermove=e=>{if(!drag)return;if(Math.abs(e.clientY-drag.y0)>4)drag.moved=true;setK(drag.k0+(e.clientY-drag.y0));};
  lev.onpointerup=()=>{if(!drag)return;const d=drag;drag=null;lev.classList.remove('drag');
    if(ky>BOT-50){sfx('hit');back();czBet('');}else if(!d.moved)go();else back();};
  function go(){if(round||CT.busy)return;if(czBet(''))pull();}
  function play(p){
    round=p;CT.round=p;cab.classList.remove('win','tease');
    const tease=p.reels[0]===p.reels[1];
    iv=setInterval(()=>sfx('tick',800+Math.random()*400),80);
    p.reels.forEach((fin,i)=>{
      const list=[...cur[i]];for(let k=0;k<16+i*7+(tease&&i===2?10:0);k++)list.push(rnd());
      const top=rnd(),bot=rnd();list.push(top,fin,bot);fill(i,list);
      const dist=(list.length-3)*HS,dur=1250+i*480+(tease&&i===2?1100:0);
      strips[i].classList.add('blur');
      strips[i].animate([{transform:'translateY(0)'},{transform:`translateY(${-dist-16}px)`,offset:.92},{transform:`translateY(${-dist}px)`}],
        {duration:dur,easing:'cubic-bezier(.32,.04,.3,1)',fill:'forwards'});
      tms.push(setTimeout(()=>strips[i].classList.remove('blur'),dur-280));
      if(tease&&i===1)tms.push(setTimeout(()=>{if(alive)cab.classList.add('tease');},dur));
      tms.push(setTimeout(()=>{if(!alive)return;
        cur[i]=[top,fin,bot];strips[i].getAnimations().forEach(a=>a.cancel());fill(i,cur[i]);strips[i].style.transform='translateY(0)';sfx('hit');
        if(i===2)done(p);},dur));
    });
  }
  function done(p){
    clearInterval(iv);cab.classList.remove('tease');
    if(p.mult>0){const mids=cur.map(l=>l[1]),cnt={};mids.forEach(s=>cnt[s]=(cnt[s]||0)+1);
      mids.forEach((s,i)=>{if(cnt[s]>=2)strips[i].children[1].classList.add('hit');});cab.classList.add('win');
      tms.push(setTimeout(()=>cab.classList.remove('win'),2600));}
    czResult(p,p.payout,p.mult);send({a:'claim',token:p.token});
    round=null;CT.round=null;czUI();
  }
  return {go,play,
    label:()=>round?'Les rouleaux tournent…':`TIRER LE LEVIER · ${STAKE} 🪙`,
    disabled:()=>!!round||CT.busy||STAKE<1,
    stop(){alive=false;clearInterval(iv);tms.forEach(clearTimeout);cancelAnimationFrame(sp);if(round)send({a:'claim',token:round.token});}};
}

  mark();
  const cv=document.getElementById('rlC'),ctx=cv.getContext('2d');ctx.scale(2,2);

  function draw(bA,bR){

      ctx.save();ctx.translate(C,C);ctx.rotate(a+seg/2);ctx.translate(111,0);ctx.rotate(Math.PI/2);
      ctx.fillStyle='#fff';ctx.font='bold 9.5px system-ui';ctx.textAlign='center';ctx.fillText(num,0,3.5);ctx.restore();}
    ctx.fillStyle='rgba(0,0,0,.32)';ctx.beginPath();ctx.arc(C,C,101,0,2*Math.PI);ctx.moveTo(C+80,C);ctx.arc(C,C,80,0,2*Math.PI,true);ctx.fill('evenodd');
    ctx.strokeStyle='#d8b54a';ctx.lineWidth=1.1;
    for(let i=0;i<n;i++){const a=th+i*seg-Math.PI/2;ctx.beginPath();ctx.moveTo(C+Math.cos(a)*80,C+Math.sin(a)*80);ctx.lineTo(C+Math.cos(a)*122,C+Math.sin(a)*122);ctx.stroke();}
    ctx.beginPath();ctx.arc(C,C,101,0,7);ctx.stroke();
    ctx.strokeStyle='#c9a227';ctx.lineWidth=2;ctx.beginPath();ctx.arc(C,C,123,0,7);ctx.stroke();
    g=ctx.createRadialGradient(C-22,C-22,4,C,C,80);g.addColorStop(0,'#b07c42');g.addColorStop(.7,'#6b4220');g.addColorStop(1,'#3d230e');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(C,C,80,0,7);ctx.fill();ctx.strokeStyle='#c9a227';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(C,C);ctx.rotate(th);ctx.strokeStyle='#e9c46a';ctx.fillStyle='#e9c46a';ctx.lineWidth=4.5;ctx.lineCap='round';
    for(let k=0;k<4;k++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-36);ctx.stroke();ctx.beginPath();ctx.arc(0,-38,4.5,0,7);ctx.fill();ctx.rotate(Math.PI/2);}
    ctx.restore();
    g=ctx.createRadialGradient(C-4,C-4,1,C,C,13);g.addColorStop(0,'#fff6c9');g.addColorStop(1,'#b8860b');ctx.fillStyle=g;ctx.beginPath();ctx.arc(C,C,12,0,7);ctx.fill();
    if(bA!=null){const x=C+Math.cos(bA)*bR,y=C+Math.sin(bA)*bR;
      ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.arc(x+1.5,y+2,5.5,0,7);ctx.fill();
      g=ctx.createRadialGradient(x-2,y-2,.5,x,y,5.5);g.addColorStop(0,'#fff');g.addColorStop(1,'#aab2bb');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,5.5,0,7);ctx.fill();}
    g=ctx.createLinearGradient(0,0,290,290);g.addColorStop(0,'rgba(255,255,255,.12)');g.addColorStop(.5,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(C,C,145,0,7);ctx.fill();
  }
  function loop(t){
    if(!alive)return;const dt=lt?Math.min(50,t-lt):16;lt=t;let bA=null,bR=90;
    if(spin){const k=Math.min(1,(t-spin.t0)/DUR);th=spin.th0+spin.W*(1-Math.pow(1-k,3));
      const kb=Math.min(1,(t-spin.t0)/(DUR*.8)),eb=1-Math.pow(1-kb,2.2);
      bA=pocketA(spin.idx,th)+spin.D*(1-eb);
      if(kb<.5)bR=129;else{const s=(kb-.5)/.5,ss=s*s*(3-2*s);bR=129-(129-90)*ss+Math.abs(Math.sin(s*Math.PI*3.5))*(1-s)*13;}
      if(kb>.5&&kb<1){const sg=Math.floor((bA-th)/seg);if(sg!==lastSeg){lastSeg=sg;sfx('tick',2300+Math.random()*700);}}
      if(kb>=1&&!spin.landed){spin.landed=true;sfx('hit');}
      if(k>=1)finish();}
    else{th+=dt*.00022;if(ballIdx!=null)bA=pocketA(ballIdx,th);}
    draw(bA,bR);raf=requestAnimationFrame(loop);
  }
  function finish(){
    const p=spin.p;spin=null;ballIdx=RL_ORDER.indexOf(p.number);
    const cell=B.querySelector(`[data-c="num:${p.number}"]`);if(cell)cell.classList.add('won');
    if(p.mult>0){const s=B.querySelector('.rl-cell.sel');if(s)s.classList.add('won');}
    czHist('roulette',String(p.number),p.red?'r':'b');
    czResult(p,p.payout,p.mult,`${p.number} ${p.red?'rouge':'noir'}`);
    send({a:'claim',token:p.token});CT.round=null;czUI();
  }
  function play(p){
    B.querySelectorAll('.won').forEach(x=>x.classList.remove('won'));
    spin={p,t0:performance.now(),th0:th,W:2*Math.PI*(2+Math.random()),D:2*Math.PI*6,idx:RL_ORDER.indexOf(p.number)};
    ballIdx=null;lastSeg=null;CT.round=p;sfxNoise(.35,.12,0,2800,.7);
  }
  raf=requestAnimationFrame(loop);
  return {play,go(){if(!spin)czBet(RCHOICE);},
    label:()=>spin?'Rien ne va plus…':`LANCER LA BILLE · ${STAKE} 🪙`,
    disabled:()=>!!spin||CT.busy||STAKE<1,
    stop(){alive=false;cancelAnimationFrame(raf);if(spin)send({a:'claim',token:spin.p.token});}};
}

/* ── 💣 mines ── */
function czMines(){
  document.getElementById('czStage').innerHTML=`<div class="mn-wrap"><div class="mn-side">
      <div class="mn-lab">Nombre de mines</div><div class="mn-opts" id="mnO">${V.casino.mines.map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>
      <div class="mn-lab">Multiplicateur</div><div class="mn-big" id="mnM"></div>
      <div class="mn-lab">Prochaine case sûre</div><div id="mnN"></div>
      <div class="mn-lab">Si tu encaisses</div><div id="mnP"></div></div>
    <div class="mn-grid" id="mnG">${Array.from({length:25},(_,i)=>`<button class="mn-t" data-i="${i}"></button>`).join('')}</div></div>`;
  const tiles=[...document.querySelectorAll('#mnG .mn-t')],O=document.getElementById('mnO');
  const mm=(m,k)=>{let r=1;for(let i=0;i<k;i++)r*=(25-i)/(25-m-i);return r;};
  let round=null,k=0,pay=0,queued=null,wait=false,dirty=false;
  const info=()=>{const m=round?round.mines:MCOUNT;
    document.getElementById('mnM').textContent='×'+czM(mm(m,k));
    document.getElementById('mnN').textContent='×'+czM(mm(m,k+1));
    document.getElementById('mnP').innerHTML=czC(round&&k?`<b>${pay}</b> 🪙`:`${Math.floor(STAKE*mm(m,1))} 🪙 dès la 1re case`);
    O.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',+b.dataset.n===MCOUNT);b.disabled=!!round;});};
  O.onclick=e=>{const b=e.target.closest('button');if(!b||round)return;MCOUNT=+b.dataset.n;czClink();info();};
  const reset=()=>{tiles.forEach(t=>{t.className='mn-t';t.textContent='';});dirty=false;};
  tiles.forEach(t=>t.onclick=()=>{const i=+t.dataset.i;
    if(round){if(wait||t.classList.contains('open'))return;wait=true;t.classList.add('wait');send({a:'minesPick',token:round.token,idx:i});czUI();return;}
    if(CT.busy)return;if(dirty)reset();queued=i;t.classList.add('wait');
    if(!czBet(String(MCOUNT))){queued=null;t.classList.remove('wait');}});
  const reveal=mines=>mines.forEach((i,j)=>{const t=tiles[i];if(t.classList.contains('boom'))return;
    setTimeout(()=>{t.classList.add('open','bomb');t.classList.remove('dim');t.textContent='💣';},70*j);});
  const end=mines=>{round=null;CT.round=null;wait=false;dirty=true;k=0;pay=0;
    tiles.forEach((t,i)=>{t.classList.remove('wait');if(!t.classList.contains('open')&&mines.indexOf(i)<0)t.classList.add('dim');});info();czUI();};
  window.minesSafe=(i,mult,next,p)=>{if(!round)return;const t=tiles[i];t.classList.remove('wait');t.classList.add('open','gem');t.textContent='💎';
    k++;pay=p;wait=false;sfx('gem');info();czUI();};
  window.minesBoom=(i,mines)=>{if(!round)return;const r=round,t=tiles[i];t.classList.remove('wait');t.classList.add('open','boom');t.textContent='💥';sfx('boom');
    const s=document.getElementById('czStage');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');
    setTimeout(()=>reveal(mines.filter(x=>x!==i)),250);end(mines);czResult(r,0,0,'BOUM !');};
  window.minesCashed=(p,mult,mines)=>{if(!round)return;const r=round;
    tiles.forEach(t=>{if(t.classList.contains('wait')){t.classList.add('open','gem');t.textContent='💎';}});
    reveal(mines);end(mines);czResult(r,p,mult);};
  function play(p){round=p;CT.round=p;k=0;pay=0;wait=false;info();
    if(queued!=null){const i=queued;queued=null;wait=true;send({a:'minesPick',token:p.token,idx:i});}}
  function go(){
    if(round){if(k>0&&!wait){wait=true;send({a:'minesCash',token:round.token});czUI();}return;}
    if(CT.busy)return;if(dirty)reset();queued=null;czBet(String(MCOUNT));
  }
  info();
  return {play,go,
    label:()=>!round?`MISER · ${STAKE} 🪙`:k===0?'Retourne une case…':`ENCAISSER · ${pay} 🪙`,
    disabled:()=>round?(k===0||wait):(CT.busy||STAKE<1),
    cash:()=>!!round&&k>0,
    ui(){if(!round)info();},
    fail(){queued=null;tiles.forEach(t=>t.classList.remove('wait'));},
    stop(){if(round)send({a:k>0?'minesCash':'minesCancel',token:round.token});
      window.minesSafe=window.minesBoom=window.minesCashed=()=>{};}};
}

/* ── 🔻 plinko ── */
function czPlinko(){
  const R=12,dx=40,dy=29,top=56,W=580,cx=W/2,pr=4.5,br=8,bY=top+(R-1)*dy+24,H=bY+44;
  document.getElementById('czStage').innerHTML=`<div class="pk-wrap"><canvas id="pkC"></canvas>
    <div class="cz-hint">Clique sur le plateau pour lâcher une bille : tu peux en lâcher plusieurs à la suite</div></div>`;
  const cv=document.getElementById('pkC'),dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const mults=V.casino.plinko;
  const col=m=>m>=10?['#ff4d6d','#a3122a']:m>=4?['#ff9a3d','#c2410c']:m>=1.5?['#ffcf4d','#b7791f']:m>=1?['#43e08c','#15803d']:['#7d8ba3','#3a4556'];
  /* rangée i : i+3 clous, décalés d'un demi-pas à chaque rangée ; la bille tombe pile sur le clou du milieu */
  const pegs=[];for(let i=0;i<R;i++)for(let k=0;k<i+3;k++)pegs.push({x:cx+(k-(i+2)/2)*dx,y:top+i*dy,h:0});
  const pegAt=(i,k)=>pegs[i*(i+5)/2+k];
  const bk=mults.map((m,k)=>({m,x:cx+(k-R/2)*dx,h:0}));
  let balls=[],texts=[],alive=true,raf=0;
  const fm=m=>m>=10?String(Math.round(m)):czM(m);
  const rr=(x,y,w,h,r)=>{ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);};
  function path(p){
    const pts=[{x:cx+(Math.random()-.5)*3,y:top-42}];let r=0;
    for(let i=0;i<R;i++){const d=p.path[i];pts.push({x:cx+(r-i/2)*dx+(d?2.5:-2.5),y:top+i*dy-pr-br+1,peg:[i,r+1]});r+=d;}
    pts.push({x:cx+(r-R/2)*dx,y:bY+6,bucket:r});
    const T=[0];for(let j=1;j<pts.length;j++)T.push(T[j-1]+(j===1?300:j===pts.length-1?190:150-j*2.5));
    return {pts,T};
  }
  function play(p){const q=path(p);balls.push({p,pts:q.pts,T:q.T,t0:performance.now(),seg:0,x:q.pts[0].x,y:q.pts[0].y});}
  function land(b,t){
    const p=b.p,k=b.pts[b.pts.length-1].bucket,bb=bk[k];bb.h=t;
    texts.push({x:bb.x,y:bY-6,t,txt:(p.payout>p.stake?'+':'')+p.payout,good:p.payout>=p.stake});
    send({a:'claim',token:p.token});czResult(p,p.payout,p.mult,'',true);
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(255,215,94,.85)';ctx.beginPath();ctx.moveTo(cx-13,top-58);ctx.lineTo(cx+13,top-58);ctx.lineTo(cx,top-46);ctx.fill();
    for(const g of pegs){const a=g.h?Math.max(0,1-(t-g.h)/380):0;
      if(a>0){ctx.fillStyle=`rgba(255,215,94,${.4*a})`;ctx.beginPath();ctx.arc(g.x,g.y,pr+8*a,0,7);ctx.fill();}
      ctx.fillStyle=a>0?'#fff6c9':'rgba(255,255,255,.82)';ctx.beginPath();ctx.arc(g.x,g.y,pr,0,7);ctx.fill();}
    bk.forEach(b=>{const a=b.h?Math.max(0,1-(t-b.h)/550):0,off=a?Math.sin(a*Math.PI)*7:0;
      const [c1,c2]=col(b.m),x=b.x-dx/2+2,y=bY+off,w=dx-4,h=30,g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);
      if(a>0){ctx.shadowColor=c1;ctx.shadowBlur=22*a;}
      ctx.fillStyle=g;rr(x,y,w,h,7);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle='#fff';ctx.font='800 11px system-ui';ctx.textAlign='center';ctx.fillText('×'+fm(b.m),b.x,y+19);});
    for(const b of balls){const g=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,br);g.addColorStop(0,'#fff');g.addColorStop(.35,'#ff7ac0');g.addColorStop(1,'#b0166e');
      ctx.shadowColor='rgba(255,90,180,.85)';ctx.shadowBlur=12;ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,br,0,7);ctx.fill();ctx.shadowBlur=0;}
    texts=texts.filter(x=>t-x.t<1100);
    for(const x of texts){const k=(t-x.t)/1100;ctx.globalAlpha=1-k;ctx.fillStyle=x.good?'#ffe58a':'#d0d6df';ctx.font='800 15px system-ui';ctx.textAlign='center';
      ctx.fillText(x.txt,x.x,x.y-k*40);ctx.globalAlpha=1;}
  }
  function frame(t){
    if(!alive)return;
    for(const b of balls){const e=t-b.t0;let j=b.seg;while(j<b.T.length-1&&e>=b.T[j+1])j++;
      for(let s=b.seg+1;s<=j;s++){const q=b.pts[s];if(q.peg){pegAt(q.peg[0],q.peg[1]).h=t;sfx('tick',900+q.peg[0]*95);}}
      b.seg=j;
      if(j>=b.T.length-1){b.done=true;land(b,t);continue;}
      const a=b.pts[j],c=b.pts[j+1],f=(e-b.T[j])/(b.T[j+1]-b.T[j]);
      b.x=a.x+(c.x-a.x)*f;
      b.y=j===0?a.y+(c.y-a.y)*f*f:a.y+(c.y-a.y)*f-(j===b.T.length-2?7:11)*4*f*(1-f);}
    balls=balls.filter(b=>!b.done);
    draw(t);raf=requestAnimationFrame(frame);
  }
  cv.onclick=()=>czBet('');
  raf=requestAnimationFrame(frame);
  return {play,go(){czBet('');},
    label:()=>`LÂCHER UNE BILLE · ${STAKE} 🪙`,
    disabled:()=>CT.busy||STAKE<1,
    stop(){alive=false;cancelAnimationFrame(raf);const b=balls[balls.length-1];if(b)send({a:'claim',token:b.p.token});}};
}

/* ── 🚀 fusée ── */
function czFusee(){
  const W=760,H=320,dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  document.getElementById('czStage').innerHTML=`<div class="fu-wrap"><canvas id="fuC"></canvas><div class="fu-m" id="fuM">×1,00</div>
    <label class="fu-auto">Encaisser auto à ×<input id="fuA" type="number" step="0.1" min="1.1" placeholder="—" value="${CZ_AUTO||''}"></label></div>`;
  const cv=document.getElementById('fuC');cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const fuM=document.getElementById('fuM');
  document.getElementById('fuA').oninput=e=>{CZ_AUTO=parseFloat(String(e.target.value).replace(',','.'))||0;};
  const stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.8+.2}));
  let fl=null,parts=[],alive=true,raf=0,lt=0,shake=0,rx=0,ry=0,ang=-Math.PI/3;
  const X=(t,mt)=>56+t/mt*(W-130),Y=(m,mm)=>H-40-(m-1)/(mm-1)*(H-100);
  const NICE=[1,1.5,2,3,5,10,20,50,100,200,500,1000];
  function setM(){const m=fl?fl.m:1;fuM.textContent=fl&&fl.end==='crash'?'💥 ×'+m.toFixed(2).replace('.',','):'×'+m.toFixed(2).replace('.',',');
    fuM.className='fu-m'+(fl&&fl.end==='crash'?' crash':fl&&fl.cashed?' cash':'');}
  function boom(){for(let i=0;i<80;i++){const a=Math.random()*6.283,v=1+Math.random()*5.5;
    parts.push({x:rx,y:ry,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:.012+Math.random()*.012,s:2+Math.random()*3.5,c:['#ffd75e','#ff9a3d','#ff4d6d','#fff'][i%4]});}}
  function end(kind){fl.end=kind;CT.round=null;czUI();}
  function cashout(){
    if(!fl||fl.end||fl.cashed)return;const m=fl.m;fl.cashed=m;fl.cashT=fl.pts[fl.pts.length-1][0];sfxRocket(false);
    send({a:'casinoCashout',token:fl.p.token,m:m});czResult(fl.p,Math.floor(fl.p.stake*m),m);setM();czUI();
  }
  function frame(now){
    if(!alive)return;const dt=lt?Math.min(50,now-lt):16;lt=now;let speed=.012;
    if(fl&&!fl.end){const t=(now-fl.t0)/1000;let m=Math.floor(Math.exp(.11*t)*100)/100;
      if(m>=fl.p.crash){m=fl.p.crash;fl.m=m;fl.pts.push([t,m]);sfxRocket(false);sfx('boom');shake=16;
        boom();end('crash');setM();
        if(!fl.cashed){czResult(fl.p,0,0,'explosion à ×'+czM(m));send({a:'claim',token:fl.p.token});}}
      else{fl.m=m;fl.pts.push([t,m]);
        if(!fl.cashed){sfxRocket(true,m);if(CZ_AUTO>=1.01&&m>=CZ_AUTO)cashout();}
        else if(t-fl.cashT>6)end('gone');
        setM();czUI();}
      speed=.05+Math.min(1,(m-1)/5)*.5;}
    for(const s of stars){s.x-=speed*dt*s.z;if(s.x<0){s.x=W;s.y=Math.random()*H;}}
    draw(now,dt);raf=requestAnimationFrame(frame);
  }
  function draw(now,dt){
    ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9;if(shake<.4)shake=0;}
    let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090418');g.addColorStop(1,'#22104a');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
    for(const s of stars){ctx.fillStyle=`rgba(255,255,255,${.2+s.z*.6})`;ctx.fillRect(s.x,s.y,s.z*2,s.z*2);}
    const pts=fl?fl.pts:[],last=pts.length?pts[pts.length-1]:[0,1],mt=Math.max(8,last[0]*1.15),mm=Math.max(2,last[1]*1.25);
    ctx.lineWidth=1;ctx.font='11px system-ui';ctx.textAlign='right';
    for(const v of NICE){if(v>mm)break;const y=Y(v,mm);ctx.strokeStyle='rgba(255,255,255,.07)';ctx.beginPath();ctx.moveTo(50,y);ctx.lineTo(W-20,y);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillText('×'+String(v).replace('.',','),44,y+4);}
    if(pts.length>1){
      ctx.beginPath();pts.forEach(([t,m],i)=>{const x=X(t,mt),y=Y(m,mm);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      const lg=ctx.createLinearGradient(56,0,W-70,0);lg.addColorStop(0,'#7c3aed');lg.addColorStop(1,fl.end==='crash'?'#ff4d6d':'#22d3ee');
      ctx.strokeStyle=lg;ctx.lineWidth=4;ctx.lineJoin='round';ctx.shadowColor='#a78bfa';ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0;
      ctx.lineTo(X(last[0],mt),H-40);ctx.lineTo(X(0,mt),H-40);ctx.closePath();
      const ag=ctx.createLinearGradient(0,0,0,H);ag.addColorStop(0,'rgba(124,58,237,.32)');ag.addColorStop(1,'rgba(124,58,237,0)');ctx.fillStyle=ag;ctx.fill();}
    if(fl&&fl.cashed){const x=X(fl.cashT,mt),y=Y(fl.cashed,mm);ctx.fillStyle='#43e08c';ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();
      ctx.font='bold 12px system-ui';ctx.textAlign='left';ctx.fillText('✓ ×'+czM(fl.cashed),x+9,y-9);}
    if(pts.length){rx=X(last[0],mt);ry=Y(last[1],mm);if(pts.length>6){const q=pts[pts.length-7];ang=Math.atan2(ry-Y(q[1],mm),rx-X(q[0],mt));}}
    else{rx=X(0,8);ry=Y(1,2)-6;ang=-Math.PI/3;}
    const flying=fl&&!fl.end;
    if(!fl||!fl.end||fl.end==='gone'){const n=flying?3:1;for(let i=0;i<n;i++){const a=ang+Math.PI+(Math.random()-.5)*.6,v=(flying?2.2:.8)+Math.random()*1.5;
      parts.push({x:rx-Math.cos(ang)*15,y:ry-Math.sin(ang)*15,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:flying?.05:.08,s:flying?3.5:2.5,c:Math.random()<.5?'#ffd75e':'#ff7a3d'});}}
    const k=dt/16;
    parts=parts.filter(p=>(p.l-=p.d*k)>0);
    for(const p of parts){p.x+=p.vx*k;p.y+=p.vy*k;p.vx*=.97;p.vy*=.97;ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*p.l+.5,0,7);ctx.fill();}
    ctx.globalAlpha=1;
    if(!(fl&&fl.end==='crash')){ctx.save();ctx.translate(rx,ry);ctx.rotate(ang+Math.PI/4);ctx.font='30px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🚀',0,0);ctx.restore();}
    ctx.restore();
  }
  function play(p){fl={p,t0:performance.now(),m:1,pts:[[0,1]],cashed:null,cashT:0,end:null};CT.round=p;parts=[];setM();sfxNoise(.6,.18,0,500,.6);}
  raf=requestAnimationFrame(frame);

    go(){if(fl&&!fl.end){cashout();return;}if(!CT.round)czBet('');},
    label:()=>fl&&!fl.end?(fl.cashed?`Encaissé à ×${czM(fl.cashed)} ✓`:`ENCAISSER · ${Math.floor(fl.p.stake*fl.m)} 🪙`):`DÉCOLLER · ${STAKE} 🪙`,
    disabled:()=>fl&&!fl.end?!!fl.cashed:(CT.busy||STAKE<1),
    cash:()=>!!(fl&&!fl.end&&!fl.cashed),
    stop(){alive=false;cancelAnimationFrame(raf);sfxRocket(false);if(fl&&!fl.end&&!fl.cashed)send({a:'casinoCashout',token:fl.p.token,m:fl.m});}};
}

  sfx('shake');
  root.innerHTML=`<h2>🎁 Coffre de série</h2><div class="chestwrap" id="chw"><div class="rays"></div><div class="chest shake" id="chx">${V.chest_svg[0]}</div></div>
    <div class="loot" id="loot"></div><div class="actions" id="cact"></div>`;
  const tms=[];
  tms.push(setTimeout(()=>{const x=document.getElementById('chx');if(!x)return;x.classList.remove('shake');x.innerHTML=V.chest_svg[1];
    document.getElementById('chw').classList.add('open');sfx('big');planifConfetti();
    p.loot.forEach((l,i)=>tms.push(setTimeout(()=>{const d=document.createElement('div');if(l.big)d.className='big';
      d.innerHTML=esc(l.icon+' '+l.text).split('🪙').join(COIN);document.getElementById('loot').appendChild(d);},350+i*500)));
    tms.push(setTimeout(()=>{document.getElementById('cact').innerHTML=`<button class="primary" onclick="closeGame()">Super !</button>`;send({a:'refresh'});},500+p.loot.length*500));
  },1450));
  GAME={stop(){tms.forEach(clearTimeout);}};
}
function wheelGame(p,root){
  root.innerHTML=`<h2>🎡 Roue de la fortune</h2><div class="wheelwrap"><div class="pointer">▼</div><canvas id="wc" width="340" height="340"></canvas></div>
    <p id="wres" class="res">La roue tourne…</p><div class="actions" id="wact"></div>`;
  const cv=document.getElementById('wc'),ctx=cv.getContext('2d'),n=p.labels.length,seg=2*Math.PI/n,R=160,cx=170,cy=170;
  const cols=['#ff5e7e','#ffc93c','#3cc68f','#4fb0ef','#a88fff','#ff8f3c','#2fc4c4','#f06bd0'];
  function draw(rot){
    ctx.clearRect(0,0,340,340);
    for(let i=0;i<n;i++){
      const a=rot+i*seg-Math.PI/2;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a,a+seg);ctx.closePath();
      ctx.fillStyle=cols[i%cols.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      ctx.save();ctx.translate(cx,cy);ctx.rotate(a+seg/2);ctx.textAlign='right';ctx.fillStyle='#1b1b1f';
      ctx.font='bold '+(p.labels[i].length>12?11:13)+'px system-ui,sans-serif';ctx.fillText(p.labels[i],R-10,5);ctx.restore();
    }
    ctx.beginPath();ctx.arc(cx,cy,22,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();
    ctx.font='20px system-ui';ctx.textAlign='center';ctx.fillText('🪙',cx,cy+7);
  }
  const target=2*Math.PI*6-(p.index+.5)*seg+(Math.random()-.5)*seg*.6, dur=4200, t0=performance.now();
  let raf=0, alive=true;
  let lastSeg=-1;
  function frame(t){
    if(!alive)return;
    const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    draw(target*e);const sg=Math.floor(target*e/seg);if(sg!==lastSeg){lastSeg=sg;sfx('tick');}
    if(k<1){raf=requestAnimationFrame(frame);return;}
    const lose=p.label==='Raté';
    document.getElementById('wres').textContent= lose?'Raté… la prochaine sera la bonne !':'Gagné : '+p.label+' 🎉';
    if(lose)sfx('lose');
    send({a:'claim',token:p.token});
    if(!lose) planifConfetti();
    document.getElementById('wact').innerHTML=endButtons('roue');
  }
  draw(0); raf=requestAnimationFrame(frame);
  GAME={stop(){alive=false;cancelAnimationFrame(raf);}};
}

function scratchGame(p,root){
  root.innerHTML=`<h2>🎟️ Carte à gratter</h2><p class="muted small">Gratte avec la souris. Trois symboles identiques et tu gagnes.</p>
    <div class="scratch"><div class="sgrid">${p.grid.map(s=>`<div class="${s===p.win?'w':''}">${s}</div>`).join('')}</div><canvas id="sc" width="300" height="300"></canvas></div>
    <p id="sres" class="res"></p><div class="actions" id="sact"><button onclick="GAME.reveal()">Tout révéler</button></div>`;
  const cv=document.getElementById('sc'),ctx=cv.getContext('2d');
  const gr=ctx.createLinearGradient(0,0,300,300);gr.addColorStop(0,'#c9ced6');gr.addColorStop(.5,'#eef1f5');gr.addColorStop(1,'#aeb4be');
  ctx.fillStyle=gr;ctx.fillRect(0,0,300,300);
  ctx.fillStyle='#7a808a';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('Gratte-moi ✨',150,156);
  ctx.globalCompositeOperation='destination-out';
  let down=false,moves=0,done=false;
  function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*300/r.height];}
  function scratch(e){if(!down||done)return;sfx('scratch');const[x,y]=pos(e);ctx.beginPath();ctx.arc(x,y,20,0,2*Math.PI);ctx.fill();
    if(++moves%10===0){const d=ctx.getImageData(0,0,300,300).data;let c=0;for(let i=3;i<d.length;i+=64)if(d[i]===0)c++;if(c/(d.length/64)>.6)reveal();}}
  function reveal(){
    if(done)return;done=true;cv.style.opacity=0;setTimeout(()=>cv.remove(),650);
    document.querySelectorAll('.sgrid div.w').forEach(d=>d.classList.add('win'));
    document.getElementById('sres').textContent=p.label;
    if(p.win){send({a:'claim',token:p.token});planifConfetti();}else sfx('lose');
    document.getElementById('sact').innerHTML=endButtons('grattage');
  }
  cv.addEventListener('mousedown',e=>{down=true;scratch(e);});
  cv.addEventListener('mousemove',scratch);
  const up=()=>{down=false;};window.addEventListener('mouseup',up);
  GAME={reveal,stop(){window.removeEventListener('mouseup',up);}};
}

function snakeGame(p,root){
  const best=gameInfo('serpent').best;
  root.innerHTML=`<h2>🐍 Serpent</h2><p class="muted small">Flèches ou ZQSD pour diriger. Record : ${best==null?'aucun':best}</p>
    <canvas id="gc" width="400" height="400"></canvas><p id="gs" class="res">Prêt·e ?</p><div class="actions" id="gact"></div>`;
  const cv=document.getElementById('gc'),ctx=cv.getContext('2d'),N=20,C=20;
  const acc=cssv('--indigo')||'#4f63d8', bg=cssv('--bg')||'#eef2f0';
  let snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}],dir={x:1,y:0},queue=[],score=0,speed=130,alive=true,timer=0;
  function spawn(){let f;do{f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}while(snake.some(s=>s.x===f.x&&s.y===f.y));return f;}
  let food=spawn();
  const K={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],z:[0,-1],w:[0,-1],s:[0,1],q:[-1,0],a:[-1,0],d:[1,0]};
  function key(e){const k=K[e.key]||K[(e.key||'').toLowerCase()];if(!k)return;e.preventDefault();
    const last=queue.length?queue[queue.length-1]:dir;if(k[0]===-last.x&&k[1]===-last.y)return;if(queue.length<2)queue.push({x:k[0],y:k[1]});}
  window.addEventListener('keydown',key);
  function draw(){
    ctx.fillStyle=bg;ctx.fillRect(0,0,400,400);
    ctx.font='17px system-ui';ctx.textAlign='center';ctx.fillText('🍎',food.x*C+C/2,food.y*C+C/2+6);
    snake.forEach((s,i)=>{ctx.fillStyle=acc;ctx.globalAlpha=i===0?1:Math.max(.45,1-i*.03);ctx.fillRect(s.x*C+1,s.y*C+1,C-2,C-2);});
    ctx.globalAlpha=1;
  }
  function step(){
    if(!alive)return;
    if(queue.length)dir=queue.shift();
    const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){return over();}
    snake.unshift(h);
    if(h.x===food.x&&h.y===food.y){score++;sfx('coin');speed=Math.max(60,speed-4);food=spawn();}else snake.pop();
    document.getElementById('gs').textContent='Pommes : '+score;
    draw();timer=setTimeout(step,speed);
  }
  function over(){
    alive=false;
    sfx('lose');document.getElementById('gs').textContent=`Partie terminée : ${score} pomme${score>1?'s':''} 🍎`;
    send({a:'score',game:'serpent',score:score});
    document.getElementById('gact').innerHTML=endButtons('serpent');
  }
  draw();timer=setTimeout(step,700);
  GAME={stop(){alive=false;clearTimeout(timer);window.removeEventListener('keydown',key);}};
}

function brickGame(p,root){
  const best=gameInfo('briques').best;
  root.innerHTML=`<h2>🧱 Casse-briques</h2><p class="muted small">Souris ou flèches pour bouger, clic ou espace pour lancer. Record : ${best==null?'aucun':best}</p>
    <canvas id="bc" width="480" height="380"></canvas><p id="bs" class="res">Clique pour lancer la balle</p><div class="actions" id="bact"></div>`;
  const cv=document.getElementById('bc'),ctx=cv.getContext('2d'),W=480,H=380;
  const acc=cssv('--indigo')||'#4f63d8', bg=cssv('--bg')||'#eef2f0', ink=cssv('--ink')||'#1b2a30';
  const rowCols=['#ff5e7e','#ff8f3c','#ffc93c','#3cc68f','#4fb0ef','#a88fff'];
  const pad={w:84,h:10,x:W/2-42,y:H-28};
  let ball,bricks,lives=3,score=0,level=1,spd=4.4,stuck=true,alive=true,raf=0,left=false,right=false;
  function build(){bricks=[];const rows=Math.min(6,4+level),cols=8,bw=52,bh=16,gap=5,ox=(W-(cols*bw+(cols-1)*gap))/2;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:ox+c*(bw+gap),y:36+r*(bh+gap),w:bw,h:bh,col:rowCols[r%6],on:true});}
  function reset(){ball={x:pad.x+pad.w/2,y:pad.y-7,vx:0,vy:0,r:6};stuck=true;}
  function launch(){if(!stuck||!alive)return;stuck=false;const a=(Math.random()-.5)*.8;ball.vx=spd*Math.sin(a);ball.vy=-spd*Math.cos(a);
    document.getElementById('bs').textContent='Score : '+score;}
  build();reset();
  function mm(e){const r=cv.getBoundingClientRect();pad.x=Math.max(0,Math.min(W-pad.w,(e.clientX-r.left)*W/r.width-pad.w/2));}
  function kd(e){if(e.key==='ArrowLeft'){left=true;e.preventDefault();}if(e.key==='ArrowRight'){right=true;e.preventDefault();}if(e.key===' '){launch();e.preventDefault();}}
  function ku(e){if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false;}
  cv.addEventListener('mousemove',mm);cv.addEventListener('click',launch);
  window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
  function update(){
    if(left)pad.x=Math.max(0,pad.x-7);if(right)pad.x=Math.min(W-pad.w,pad.x+7);
    if(stuck){ball.x=pad.x+pad.w/2;ball.y=pad.y-7;return;}
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}
    if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);}
    if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}
    if(ball.vy>0&&ball.y+ball.r>=pad.y&&ball.y-ball.r<pad.y+pad.h&&ball.x>=pad.x-ball.r&&ball.x<=pad.x+pad.w+ball.r){
      const hit=Math.max(-1,Math.min(1,(ball.x-(pad.x+pad.w/2))/(pad.w/2))),a=hit*1.05,s=Math.hypot(ball.vx,ball.vy);
      ball.vx=s*Math.sin(a);ball.vy=-s*Math.cos(a);ball.y=pad.y-ball.r;}
    for(const b of bricks){if(!b.on)continue;
      const nx=Math.max(b.x,Math.min(ball.x,b.x+b.w)),ny=Math.max(b.y,Math.min(ball.y,b.y+b.h));
      if((ball.x-nx)**2+(ball.y-ny)**2<=ball.r*ball.r){b.on=false;score+=10;sfx('tick',900+Math.random()*900);
        if(nx===b.x||nx===b.x+b.w)ball.vx=-ball.vx;else ball.vy=-ball.vy;
        document.getElementById('bs').textContent='Score : '+score;break;}}
    if(bricks.every(b=>!b.on)){level++;spd*=1.12;build();reset();document.getElementById('bs').textContent=`Niveau ${level} ! Clique pour relancer`;}
    if(ball.y>H+ball.r){lives--;sfx('miss');if(lives<=0)return over();reset();document.getElementById('bs').textContent=`Balle perdue, encore ${lives} vie${lives>1?'s':''}. Clique pour relancer`;}
  }
  function draw(){
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    bricks.forEach(b=>{if(b.on){ctx.fillStyle=b.col;ctx.fillRect(b.x,b.y,b.w,b.h);}});
    ctx.fillStyle=acc;ctx.fillRect(pad.x,pad.y,pad.w,pad.h);
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,2*Math.PI);ctx.fillStyle=ink;ctx.fill();
    ctx.font='13px system-ui';ctx.textAlign='left';ctx.fillStyle=ink;ctx.fillText('❤️'.repeat(lives),8,20);
    ctx.textAlign='right';ctx.fillText(score+' pts',W-8,20);
  }
  function loop(){if(!alive)return;update();if(alive){draw();raf=requestAnimationFrame(loop);}}
  function over(){
    alive=false;draw();
    sfx('lose');document.getElementById('bs').textContent=`Partie terminée : ${score} points`;
    send({a:'score',game:'briques',score:score});
    document.getElementById('bact').innerHTML=endButtons('briques');
  }
  raf=requestAnimationFrame(loop);
  GAME={stop(){alive=false;cancelAnimationFrame(raf);window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);}};
}
</script>
